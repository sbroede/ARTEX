name: Codex Bridge

on:
  push:
    paths:
      - integrations/codex-bridge/**
      - .github/workflows/codex-bridge.yml
  pull_request:
    paths:
      - integrations/codex-bridge/**
      - .github/workflows/codex-bridge.yml

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test test/*.test.mjs
        working-directory: integrations/codex-bridge
